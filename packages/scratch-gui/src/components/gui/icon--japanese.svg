    <title>Japanese</title>
    <g fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="16" height="16" rx="2.5" fill="#E7F3EE" stroke="#0A7D5C" stroke-width="1.4"/>
        <path d="M5.5,6 L14.5,6" stroke="#0A7D5C" stroke-width="1.6"/>
        <path d="M7,9 L7,14.5 L9,14.5" stroke="#0A7D5C" stroke-width="1.6"/>
        <path d="M9.5,10.5 L14.5,10.5" stroke="#0A7D5C" stroke-width="1.6"/>
        <path d="M9.5,13 L13,13" stroke="#0A7D5C" stroke-width="1.6"/>
    </g>
</svg>
