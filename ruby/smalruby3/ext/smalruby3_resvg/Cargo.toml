[package]
name = "smalruby3_resvg"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Rust native extension for smalruby3: SVG-to-PNG conversion (powered by resvg) and RGBA-to-PNG encoding"

[dependencies]
magnus = "0.7"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
png = "0.17"
tempfile = "3"

[lib]
crate-type = ["cdylib"]
