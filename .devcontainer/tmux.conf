# .devcontainer/tmux.conf
#
# devpod / devcontainer 用 tmux 設定。
# post-create.sh が ~/.tmux.conf としてインストールする。
#
# 除去したもの (macOS 固有):
#   - tmux-yank プラグイン (pbcopy 依存)
#   - copy-mode の pbcopy パイプ
#   - status-right の #(wifi) / #(battery --tmux)

# ----- Plugins -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ----- Prefix -----
unbind C-b
set-option -g prefix C-z
bind C-z send-prefix

# ----- Index -----
set -g base-index 1
setw -g pane-base-index 1

# ----- Reload -----
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ----- Timing -----
set -sg escape-time 1

# ----- Pane split -----
bind | split-window -h
bind - split-window -v

# ----- Mouse -----
set -g mouse on
# C-z m でマウスモード ON/OFF トグル。OFF 中はターミナルネイティブ選択で OS クリップボードにコピー可
bind m set -g mouse \; display "Mouse: #{?mouse,on,off}"

# ----- Window naming -----
set-window-option -g automatic-rename off

# ----- Copy mode -----
set-window-option -g mode-keys emacs
bind-key C-y paste-buffer
bind -n Pageup copy-mode -u

# OSC 52 DCS パススルーで SSH 越しにホスト端末のクリップボードへ送る。
# tmux-yank は pbcopy/xclip がなく動作しないため使わない。
# 前提: ホスト側端末の OSC 52 受け付けが有効であること
#   iTerm2: Preferences > General > Selection >
#           "Applications in terminal may access clipboard" を ON
set -g set-clipboard on
bind -T copy-mode-emacs M-w               send-keys -X copy-pipe-and-cancel "/app/.devcontainer/osc52.sh"
bind -T copy-mode-emacs MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/app/.devcontainer/osc52.sh"

# ----- Terminal -----
set -g default-terminal "screen-256color"

# ----- Status bar -----
set -g status-style fg="cyan",bg="black"
set -g status-position top
set -g status-left-length 60
set -g status-left '#[fg=black,bg=green][#H] s#S:p#P #[default]'
set -g status-right-length 60
set -g status-right '#[fg=black,bg=cyan,bold] [%Y-%m-%d(%a) %H:%M:%S]#[default]'
set -g status-interval 1

setw -g window-status-current-style fg="black",bg="cyan","bold"

# ----- Pane borders -----
set -g pane-active-border-style fg="green",bg="green"
set -g pane-border-style fg="colour236",bg="colour236"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
