services:
  app:
    # build context を明示的に repo root に固定。
    # 基底の docker-compose.yml は `build: .` だが、merge 後の context 解決を
    # devpod / VS Code Dev Containers の両方で安定させるため、この overlay の
    # 場所からの相対パスとして `..` (= repo root) を明示する。
    # これがないと devpod が build context を `.devcontainer/` 配下と
    # 誤認し、`COPY entrypoint.sh /app/entrypoint.sh` が "not found" で失敗する。
    build:
      context: .
      dockerfile: Dockerfile
    # devcontainer 用に長寿命化（既存 compose は `npm start` で短命）
    command: sleep infinity
    # ホスト側ポート公開を無効化する。
    # 通常 compose と devcontainer (VS Code / devpod) が同時に立ち上がると、
    # どちらも :8601 を host bind しようとして衝突し、結果として devcontainer 側が
    # ネットワーク attach に失敗して container 内 DNS が壊れる事象があった。
    # devcontainer 側は forwardPorts (devcontainer.json) 経由で IDE がポート転送する
    # ため、compose レベルで host bind する必要はない。
    ports: !reset []
    volumes:
      # 全開発者で共通のマウント。個人依存のもの (~/ghq, ~/.claude 等) は
      # docker-compose.local.yml に置く (gitignore、各自で .example からコピー)。
      - type: bind
        source: ${HOME}/.gitconfig
        target: /root/.gitconfig
        read_only: true
      - type: bind
        source: ${HOME}/.config/gh
        target: /root/.config/gh
