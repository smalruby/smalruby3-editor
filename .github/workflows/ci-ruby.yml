name: CI - Ruby

on:
  pull_request:
    paths:
      - 'ruby/**'
  push:
    branches: [main, master, develop, hotfix/*]
    paths:
      - 'ruby/**'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "[smalruby3] StandardRB Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby/smalruby3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version-file: ruby/smalruby3/.ruby-version
          bundler-cache: true
          working-directory: ruby/smalruby3
      - name: Run StandardRB linter
        run: bundle exec standardrb

  unit-test:
    name: "[smalruby3] Unit Tests (Ruby ${{ matrix.ruby }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    defaults:
      run:
        working-directory: ruby/smalruby3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # SHA 固定するとツールチェーン名を ref から読めないため明示する
        with:
          toolchain: stable
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby/smalruby3
      - name: Compile native extension
        run: bundle exec rake compile
      - name: Run unit tests
        run: bundle exec rake test
