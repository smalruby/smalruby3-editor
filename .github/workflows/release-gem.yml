name: Release - smalruby3 gem

on:
  push:
    tags:
      - 'smalruby3-v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: "[smalruby3] Test before release"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    defaults:
      run:
        working-directory: ruby/smalruby3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # SHA 固定するとツールチェーン名を ref から読めないため明示する
        with:
          toolchain: stable
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby/smalruby3
      - name: Compile native extension
        run: bundle exec rake compile
      - name: Run lint
        if: matrix.ruby == '4.0'
        run: bundle exec standardrb
      - name: Run unit tests
        run: bundle exec rake test

  release:
    name: "[smalruby3] Publish to RubyGems"
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    defaults:
      run:
        working-directory: ruby/smalruby3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#smalruby3-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing smalruby3 v${VERSION}"

      - name: Verify version matches
        run: |
          GEM_VERSION=$(ruby -r ./lib/smalruby3/version -e 'puts Smalruby3::VERSION')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$GEM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: gem=$GEM_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version-file: ruby/smalruby3/.ruby-version
          bundler-cache: true
          working-directory: ruby/smalruby3

      - name: Build gem
        run: gem build smalruby3.gemspec

      - name: Push to RubyGems (Trusted Publishing)
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          working-directory: ruby/smalruby3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "smalruby3 v${{ steps.version.outputs.version }}" \
            --generate-notes \
            smalruby3-${{ steps.version.outputs.version }}.gem
