name: Gem Build Check (cross-platform)

on:
  workflow_dispatch:
    inputs:
      ruby-version:
        description: 'Ruby version to test'
        required: false
        default: '3.4'
        type: choice
        options:
          - '3.3'
          - '3.4'
          - '4.0'

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: "Build gem (Linux / Ruby ${{ inputs.ruby-version || '3.4' }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby/smalruby3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Setup Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: ${{ inputs.ruby-version || '3.4' }}
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true
          working-directory: ruby/smalruby3

      - name: Cache native extension build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ruby/smalruby3/ext/smalruby3_imageutil/target
          key: native-ext-linux-${{ inputs.ruby-version || '3.4' }}-${{ hashFiles('ruby/smalruby3/ext/smalruby3_imageutil/Cargo.toml', 'ruby/smalruby3/ext/smalruby3_imageutil/src/**') }}
          restore-keys: |
            native-ext-linux-${{ inputs.ruby-version || '3.4' }}-

      - name: Build gem
        run: gem build smalruby3.gemspec

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test

      - name: Verify smalruby3 loads
        env:
          SMALRUBY3_TESTING: '1'
        run: bundle exec ruby -e 'require "smalruby3"; puts "smalruby3 v#{Smalruby3::VERSION} loaded OK"'

      - name: Upload gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smalruby3-gem-linux
          path: ruby/smalruby3/smalruby3-*.gem

  build-windows:
    name: "Build gem (Windows / Ruby ${{ inputs.ruby-version || '3.4' }})"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ruby/smalruby3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SDL2 via MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-SDL2_ttf

      - name: Setup Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: ${{ inputs.ruby-version || '3.4' }}
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true
          working-directory: ruby/smalruby3

      - name: Add MSYS2 SDL2 to paths
        shell: pwsh
        run: |
          echo "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH
          echo "CPATH=C:\msys64\ucrt64\include" >> $env:GITHUB_ENV
          echo "LIBRARY_PATH=C:\msys64\ucrt64\lib" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Cache native extension build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ruby/smalruby3/ext/smalruby3_imageutil/target
          key: native-ext-windows-${{ inputs.ruby-version || '3.4' }}-${{ hashFiles('ruby/smalruby3/ext/smalruby3_imageutil/Cargo.toml', 'ruby/smalruby3/ext/smalruby3_imageutil/src/**') }}
          restore-keys: |
            native-ext-windows-${{ inputs.ruby-version || '3.4' }}-

      - name: Build gem
        run: gem build smalruby3.gemspec

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test

      - name: Verify smalruby3 loads
        shell: bash
        env:
          SMALRUBY3_TESTING: '1'
        run: bundle exec ruby -e 'require "smalruby3"; puts "smalruby3 v#{Smalruby3::VERSION} loaded OK"'

      - name: Upload gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smalruby3-gem-windows
          path: ruby/smalruby3/smalruby3-*.gem
