name: Deploy Infra

# infra（CDK）を stg と prod へ出す唯一の経路。
#
# stg (#1162): ローカルから `cdk deploy --context stage=stg` を撃たないための受け皿。共有資源の
# stg を人間と複数の autopilot worker が奪い合うと、片方のデプロイ途中にもう片方が入って
# CloudFormation が中断する。ここに集約して concurrency でキュー化する。
#
# prod: develop へのマージ（push）で、stg が成功したプロジェクトを prod へ出す。infra は
# 「後方互換な変更だけを GUI より先に develop へ入れる」運用なので（.claude/rules/infra/development.md）、
# マージしたらすぐ prod に出してよい。安全装置として、prod の `cdk diff` に**リソースの削除・
# 置き換え**が含まれるときは自動では出さずに止める（非互換になりうる変更は人間が判断する）。
# 差分が無いプロジェクトはデプロイしない。prod に出せたら、マージした PR が参照する
# 🧱 infra の Issue を閉じる（後続の GUI Issue が autopilot-after で動き出す合図）。

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'infra/**'
  push:
    branches: [develop]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      projects:
        description: 'デプロイする infra プロジェクト（カンマ区切り。空なら変更から自動検出）'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  select:
    name: 対象プロジェクトの選定
    # PR 経由は `deploy-stg` ラベルが付いているときだけ。ラベル付けには write 権限が要るので、
    # 「誰でも PR を出せば stg へデプロイできる」状態にはならない。
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-stg')
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.detect.outputs.projects }}
      prod_projects: ${{ steps.detect.outputs.prod_projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: 変更された infra プロジェクトを洗い出す
        env:
          MANUAL_PROJECTS: ${{ github.event.inputs.projects }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_PROJECTS}" ]; then
            # 手動起動: 指定されたものだけ。存在しない名前は落とす。
            mapfile -t names < <(echo "${MANUAL_PROJECTS}" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$')
          else
            # 差分に infra/<project>/ が現れたものだけを対象にする。
            # BASE_REF が空 / 到達不能（初回 push など）のときは何もしない（暴発防止）。
            if [ -z "${BASE_REF}" ] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
              echo "projects=[]" >> "$GITHUB_OUTPUT"
              echo "base ref を解決できないため対象なしとする: '${BASE_REF}'"
              exit 0
            fi
            mapfile -t names < <(git diff --name-only "${BASE_REF}" "${HEAD_REF}" -- 'infra/*' \
              | cut -d/ -f2 | sort -u | grep -v '^$')
          fi
          selected=()
          for name in "${names[@]}"; do
            # cdk.json を持つものだけが「デプロイできる CDK プロジェクト」。
            if [ -f "infra/${name}/cdk.json" ]; then
              selected+=("${name}")
            else
              echo "skip: infra/${name} は CDK プロジェクトではない"
            fi
          done
          if [ ${#selected[@]} -eq 0 ]; then
            echo "projects=[]" >> "$GITHUB_OUTPUT"
            echo "prod_projects=[]" >> "$GITHUB_OUTPUT"
          else
            # secret 名にはハイフンを使えない（英数字と _ のみ）ので、ここで変換して
            # matrix に載せる。Actions の式には文字列置換が無く、format() では作れない。
            json=""
            prod_json=""
            for name in "${selected[@]}"; do
              suffix="$(echo "${name}" | tr 'a-z-' 'A-Z_')"
              json="${json}{\"project\":\"${name}\",\"secret\":\"INFRA_STG_DOTENV_${suffix}\"},"
              prod_json="${prod_json}{\"project\":\"${name}\",\"secret\":\"INFRA_PROD_DOTENV_${suffix}\"},"
            done
            echo "projects=[${json%,}]" >> "$GITHUB_OUTPUT"
            echo "prod_projects=[${prod_json%,}]" >> "$GITHUB_OUTPUT"
          fi
          echo "対象: ${selected[*]:-(なし)}"

  deploy:
    name: "[${{ matrix.project }}] deploy stg"
    needs: select
    if: needs.select.outputs.projects != '[]'
    runs-on: ubuntu-latest
    environment: stg
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.projects) }}
    # スタック単位でキューする。実行中の run は打ち切らない（CloudFormation の更新を
    # 途中で止めるとロールバック待ちになり、次の run も失敗するため）。
    concurrency:
      group: infra-deploy-stg-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 前提の確認
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STG_DOTENV: ${{ secrets[matrix.secret] }}
          # プロジェクト名は PR 側のディレクトリ名から来るので、run に直接展開しない
          PROJECT: ${{ matrix.project }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::repo Variables に AWS_DEPLOY_ROLE_ARN が未設定です。GitHub OIDC で AssumeRole する IAM ロールの ARN を登録してください（docs/infra-deploy/README.md）。"
            missing=1
          fi
          if [ -z "${STG_DOTENV}" ]; then
            echo "::error::repo Secrets に ${SECRET_NAME} が未設定です。infra/${PROJECT}/.env.stg の内容をそのまま登録してください（gitignored なので CI からは見えません）。"
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1

      - name: stg の .env を用意する
        env:
          STG_DOTENV: ${{ secrets[matrix.secret] }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          # ステージ切り替えは symlink 運用（.claude/rules/infra/development.md）。
          # CI では実体を .env.stg に置き、そこへ symlink を張って手元と同じ形にする。
          printf '%s\n' "${STG_DOTENV}" > "infra/${PROJECT}/.env.stg"
          ln -sf .env.stg "infra/${PROJECT}/.env"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: infra/${{ matrix.project }}/.node-version
          cache: npm
          cache-dependency-path: infra/${{ matrix.project }}/package-lock.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        working-directory: infra/${{ matrix.project }}
        run: npm ci

      - name: cdk deploy (stg)
        working-directory: infra/${{ matrix.project }}
        run: npx cdk deploy --context stage=stg --require-approval never

      - name: デプロイ内容を PR に残す
        # 「いまの stg が誰の SHA か」を追えるようにする。共有資源なので、DoD をする側は
        # 自分の SHA が載っていることを確認してから検証する。
        # 値は env 経由でだけ渡す（ブランチ名は `$(...)` を含みうるので、run の中へ
        # ${{ }} で展開するとコマンド実行になる）。
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ matrix.project }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf '🚀 stg にデプロイしました: `%s`\n\n' "${PROJECT}"
            printf '| 項目 | 値 |\n|---|---|\n'
            printf '| commit | `%s` |\n' "${HEAD_SHA}"
            printf '| branch | `%s` |\n' "${HEAD_REF}"
            printf '| run | %s |\n\n' "${RUN_URL}"
            printf 'stg は共有環境です。**この SHA が載っている前提で** 動作確認してください。\n'
            printf '別の PR があとからデプロイすると上書きされます。\n\n'
            printf '`deploy-stg` ラベルはこの run の完了時に自動で外れます。'
            printf 'もう一度 stg に載せたいときは**ラベルを付け直して**ください。\n'
          } > "${RUNNER_TEMP}/stg-deploy-comment.md"
          gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/stg-deploy-comment.md"

  # ラベルは「1 回の操作」として扱う (#1173)。付けたら 1 回だけデプロイし、run の完了時に
  # ワークフロー自身が外す。外し忘れると push のたびに再デプロイされてしまうため
  # （実測で docs だけの push でも走った）、外す作業を人間から取り上げる。
  #
  # deploy ジョブの中で外すと、対象プロジェクトが複数あるとき二重で外して片方が 404 になる。
  # matrix の後に 1 回だけ走らせる。
  cleanup-label:
    name: deploy-stg ラベルを外す
    needs: [select, deploy]
    # 成功・失敗どちらでも外す。失敗時に残すと「次の push で勝手に再デプロイ」が復活して
    # しまい、直そうとして push するたびに走ることになる。直したら付け直す運用にする。
    #
    # ラベルが付いている run に限定する。付いていない PR（= デプロイを要求していない）でも
    # この workflow 自体は起動するので、条件を絞らないと毎 push で無駄なジョブが動く。
    if: >-
      always() && github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'deploy-stg')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: ラベルを外す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 既に外れている場合も成功させる（人間が先に外していることがある）。
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -qx 'deploy-stg'; then
            gh api --method DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/deploy-stg" --silent
            echo "deploy-stg を外した"
          else
            echo "deploy-stg は付いていない（何もしない）"
          fi

  # ---- prod ----
  # develop へのマージ（push）だけで動く。PR・手動起動では prod に出さない。stg が
  # **すべて**成功したときだけ進む（stg を prod の前段の確認として使う）。
  deploy-prod:
    name: "[${{ matrix.project }}] deploy prod"
    needs: [select, deploy]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.select.outputs.prod_projects != '[]' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    # Environment `prod` を通るジョブだけが prod 用ロールを AssumeRole できる（AWS 側の信頼条件
    # sub = repo:smalruby/smalruby3-editor:environment:prod）。ロール ARN と .env は
    # Environment の Variables / Secrets に置く（docs/infra-deploy/README.md）。
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.prod_projects) }}
    concurrency:
      group: infra-deploy-prod-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 前提の確認
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          PROD_DOTENV: ${{ secrets[matrix.secret] }}
          PROJECT: ${{ matrix.project }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Environment prod の Variables に AWS_DEPLOY_ROLE_ARN が未設定です（docs/infra-deploy/README.md）。"
            missing=1
          fi
          if [ -z "${PROD_DOTENV}" ]; then
            echo "::error::Environment prod の Secrets に ${SECRET_NAME} が未設定です。infra/${PROJECT} の prod 用 .env（.env.prod / .env.production）の内容を登録してください。"
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1

      - name: prod の .env を用意する
        env:
          PROD_DOTENV: ${{ secrets[matrix.secret] }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          printf '%s\n' "${PROD_DOTENV}" > "infra/${PROJECT}/.env.prod"
          ln -sf .env.prod "infra/${PROJECT}/.env"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: infra/${{ matrix.project }}/.node-version
          cache: npm
          cache-dependency-path: infra/${{ matrix.project }}/package-lock.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        working-directory: infra/${{ matrix.project }}
        run: npm ci

      - id: diff
        name: cdk diff (prod) — 差分と危険な変更の確認
        working-directory: infra/${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          npx cdk diff --context stage=prod --no-color 2>&1 | tee "${RUNNER_TEMP}/cdk-diff.txt"
          {
            printf '### `%s` の prod 差分\n\n```\n' "${PROJECT}"
            grep -vE '^\s*$' "${RUNNER_TEMP}/cdk-diff.txt" | tail -n 200
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'There were no differences|Number of stacks with differences: 0' "${RUNNER_TEMP}/cdk-diff.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "prod との差分なし。デプロイしない。"
            exit 0
          fi
          # 削除（[-] AWS::...）と置き換え（replace）は、いま動いている prod の画面やデータを
          # 壊しうる。後方互換な変更（追加・設定変更）だけを自動で出す。
          if grep -nE '^\[-\] AWS::|requires replacement|may be replaced|[[:space:]]replace$' "${RUNNER_TEMP}/cdk-diff.txt"; then
            echo "::error::prod の差分にリソースの削除・置き換えが含まれるため、自動デプロイを止めました。非互換になりうる変更なので、人間が内容を確認して手元から \`npx cdk deploy --context stage=prod\` を実行してください（docs/infra-deploy/README.md）。"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: cdk deploy (prod)
        if: steps.diff.outputs.changed == 'true'
        working-directory: infra/${{ matrix.project }}
        run: npx cdk deploy --context stage=prod --require-approval never

  # prod に出せたら、マージした PR が参照する 🧱 infra の Issue を閉じる。後続の GUI Issue は
  # `autopilot-after: #<infra>` でこれを待っているので、閉じた時点で動き出し、prod の API を
  # 見るブランチプレビューで確認できる。差分が無く deploy をスキップした場合も「prod は最新」
  # なので閉じてよい。
  close-infra-issues:
    name: prod に出した infra Issue を閉じる
    needs: [select, deploy-prod]
    if: needs.deploy-prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: 🧱 infra の Issue を閉じる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for pr in $(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[].number'); do
            # PR 本文の Refs / Closes / Fixes / Resolves #N を拾う（infra の PR は `Refs #N` で書く）
            nums=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.body // ""' \
              | grep -oiE '(refs|closes|fixes|resolves)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
            for n in ${nums}; do
              target=$(gh api "repos/${REPO}/issues/${n}" \
                --jq 'select(.pull_request == null and .state == "open" and (([.labels[].name] | index("🧱 infra")) != null)) | .number')
              [ -n "${target}" ] || continue
              printf '🚀 PR #%s の infra を prod にデプロイしました（%s）。この Issue を閉じます。\n\n後続の Issue（`autopilot-after: #%s`）は、prod の API を使えるので**ブランチプレビューで確認**できます。\n' \
                "${pr}" "${RUN_URL}" "${n}" > "${RUNNER_TEMP}/close-${n}.md"
              gh issue comment "${n}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/close-${n}.md"
              gh issue close "${n}" --repo "${REPO}"
              echo "closed #${n} (PR #${pr})"
            done
          done

  # prod へ出せなかったとき（危険な差分で止めた・失敗した）は、マージした PR に知らせる。
  # infra の Issue は開いたままなので、後続の GUI Issue も待ったままになる（壊れた API の上で
  # 進めない）。
  notify-prod-failure:
    name: prod デプロイの失敗を知らせる
    needs: [select, deploy-prod]
    if: always() && needs.deploy-prod.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR にコメントする
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '⚠️ この PR の infra を prod に出せませんでした: %s\n\nジョブの要約（cdk diff）を確認してください。削除・置き換えを含む差分は自動では出しません。人間が内容を確認して手元からデプロイするか、直してから run を再実行してください。prod に出るまで、この PR が参照する 🧱 infra の Issue は開いたままです。\n' \
            "${RUN_URL}" > "${RUNNER_TEMP}/prod-failure.md"
          for pr in $(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[].number'); do
            gh pr comment "${pr}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/prod-failure.md"
          done
