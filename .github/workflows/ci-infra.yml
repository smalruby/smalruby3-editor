name: CI - Infra

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches: [main, master, develop, hotfix/*]
    paths:
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  ruby-unit-tests:
    name: Ruby Unit Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/smalruby-mesh-v2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: infra/smalruby-mesh-v2/.ruby-version
          bundler-cache: true
          working-directory: infra/smalruby-mesh-v2
      - name: Run unit tests
        run: bundle exec rspec spec/unit/
      - name: Run StandardRB linter
        run: bundle exec standardrb

  cdk-build:
    name: CDK Build & Synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/smalruby-mesh-v2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: infra/smalruby-mesh-v2/.node-version
          cache: npm
          cache-dependency-path: infra/smalruby-mesh-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Synthesize CDK stack
        env:
          APPSYNC_CUSTOM_DOMAIN: 'false'
        run: npx cdk synth --context stage=stg

  security:
    name: Security Audits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/smalruby-mesh-v2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: infra/smalruby-mesh-v2/.node-version
          cache: npm
          cache-dependency-path: infra/smalruby-mesh-v2/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: infra/smalruby-mesh-v2/.ruby-version
          bundler-cache: true
          working-directory: infra/smalruby-mesh-v2
      - name: Install Node dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Run bundler-audit
        run: bundle exec bundler-audit check --update
        continue-on-error: true
