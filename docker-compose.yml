name: smalruby3-editor

services:
  app:
    build: .
    environment:
      - SMALRUBY3_HOST=0.0.0.0
      - PORT=8601
      - NODE_ENV
      - DEBUG
      - GOOGLE_CLIENT_ID
      - GOOGLE_API_KEY
      - GTM_ID
      - GTM_ENV_AUTH
      - MESH_GRAPHQL_ENDPOINT
      - MESH_API_KEY
      - MESH_AWS_REGION
      - MESH_DATA_UPDATE_INTERVAL_MS
      - MESH_EVENT_BATCH_INTERVAL_MS
      - MESH_NETWORK_FILTER
      - RUBYTEE_RELAY_ENDPOINT
      - MAX_USER_MESSAGE_LENGTH
      - MIN_USER_MESSAGE_LENGTH
      - CLASSROOM_API_ENDPOINT
      - DEV_BYPASS_TOKEN
    working_dir: /app
    shm_size: '4gb'
    command: npm start
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: smalruby3-editor_root_npm
        target: /root/.npm
      - type: volume
        source: smalruby3-editor_root_cache
        target: /root/.cache
      - type: volume
        source: smalruby3-editor_node_modules
        target: /app/node_modules
    ports:
      - 0.0.0.0:8601:8601
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  smalruby3:
    image: smalruby3-editor-smalruby3
    build:
      context: ruby/smalruby3
      dockerfile: Dockerfile
    working_dir: /app/ruby/smalruby3
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: smalruby3-editor_smalruby3_bundle
        target: /usr/local/bundle
      - type: volume
        source: smalruby3-editor_smalruby3_cargo
        target: /root/.cargo/registry
      - type: volume
        source: smalruby3-editor_smalruby3_target
        target: /app/ruby/smalruby3/target
    environment:
      - SMALRUBY3_SCREENSHOT=${SMALRUBY3_SCREENSHOT:-}
      - SMALRUBY3_SCREENSHOT_PATH=${SMALRUBY3_SCREENSHOT_PATH:-/tmp/smalruby3_screenshot.png}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # GUI display via VNC (Xvfb + x11vnc)
  # Usage: docker compose run --rm smalruby3-gui ruby -Ilib examples/01_move.rb
  # Connect with: open vnc://localhost:15900
  smalruby3-gui:
    image: smalruby3-editor-smalruby3
    working_dir: /app/ruby/smalruby3
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: smalruby3-editor_smalruby3_bundle
        target: /usr/local/bundle
      - type: volume
        source: smalruby3-editor_smalruby3_cargo
        target: /root/.cargo/registry
      - type: volume
        source: smalruby3-editor_smalruby3_target
        target: /app/ruby/smalruby3/target
    environment:
      - VNC_ENABLED=1
      - SMALRUBY3_SCREENSHOT=${SMALRUBY3_SCREENSHOT:-}
      - SMALRUBY3_SCREENSHOT_PATH=${SMALRUBY3_SCREENSHOT_PATH:-/tmp/smalruby3_screenshot.png}
    ports:
      - 0.0.0.0:15900:5900
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  infra:
    build:
      context: .
      dockerfile: infra/Dockerfile
    working_dir: /app/infra/smalruby-mesh-v2
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: smalruby3-editor_infra_mesh_v2_node_modules
        target: /app/infra/smalruby-mesh-v2/node_modules
      - type: volume
        source: smalruby3-editor_infra_bundle
        target: /bundle
      - type: bind
        source: ${HOME}/.aws
        target: /root/.aws
        read_only: true
    environment:
      - BUNDLE_PATH=/bundle
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_DEFAULT_REGION
      - CDK_DEFAULT_ACCOUNT
      - CDK_DEFAULT_REGION
      - STAGE
      - APPSYNC_CUSTOM_DOMAIN
      - APPSYNC_ENDPOINT
      - APPSYNC_API_KEY
      - MESH_SECRET_KEY
      - MESH_HOST_HEARTBEAT_INTERVAL_SECONDS
      - MESH_HOST_HEARTBEAT_TTL_SECONDS
      - MESH_MEMBER_HEARTBEAT_INTERVAL_SECONDS
      - MESH_MEMBER_HEARTBEAT_TTL_SECONDS
      - MESH_MAX_CONNECTION_TIME_SECONDS
      - MESH_EVENT_TTL_SECONDS
      - MESH_POLLING_INTERVAL_SECONDS

volumes:
  smalruby3-editor_root_npm:
  smalruby3-editor_root_cache:
  smalruby3-editor_node_modules:
  smalruby3-editor_infra_mesh_v2_node_modules:
  smalruby3-editor_smalruby3_bundle:
  smalruby3-editor_smalruby3_cargo:
  smalruby3-editor_smalruby3_target:
  smalruby3-editor_infra_bundle:
